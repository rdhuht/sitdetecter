<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sit Remoter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="status">未连接</div>
  <button id="connect">连接 micro:bit</button>

  <div id="ring-wrap">
    <svg id="ring" width="200" height="200">
      <circle id="track" cx="100" cy="100" r="88" />
      <circle id="progress" cx="100" cy="100" r="88" />
    </svg>
    <div id="time">00:00</div>
  </div>

  <div id="threshold">阈值:45 分钟</div>

  <div id="keys">
    <button id="btn-a">A (切阈值)</button>
    <button id="btn-b">B (重置)</button>
  </div>

  <audio id="audio" src="audio/alert.mp3" preload="auto"></audio>

  <script src="popup.js"></script>
</body>
</html>
